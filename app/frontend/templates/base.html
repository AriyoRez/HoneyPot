<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Deception Detection Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">🕳️ Deception Detection Lab</div>
    <nav>
      <a href="{{ url_for('operations') }}" class="{{ 'active' if request.endpoint == 'operations' }}">Operations</a>
      <a href="{{ url_for('investigation') }}" class="{{ 'active' if request.endpoint == 'investigation' }}">Investigation</a>
    </nav>
    <div class="live">
      <label><input type="checkbox" id="autorefresh" checked> Live (5s)</label>
      <span id="refreshed" class="muted"></span>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="muted">
    Lab environment — synthetic data only. Passwords shown as SHA-256 only; no plaintext is stored.
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
